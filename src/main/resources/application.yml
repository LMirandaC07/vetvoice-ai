spring:
  application:
    name: vetvoice-ai

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:vetvoice}
    username: ${PGUSER:vetvoice}
    password: ${PGPASSWORD:vetvoice}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: qwen3:1.7b
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text

server:
  port: ${PORT:8080}

vetvoice:
  ai:
    rag:
      enabled: ${VETVOICE_AI_RAG_ENABLED:true}

logging:
  level:
    org.hibernate.SQL: debug

spring:
  application:
    name: vetvoice-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/vetvoice
    username: vetvoice
    password: vetvoice
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate = nao deixa o Hibernate criar/alterar tabelas sozinho.
      # Quem manda no schema e o Flyway (migrations versionadas).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

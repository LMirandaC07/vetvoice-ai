spring:
  application:
    name: vetvoice-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/vetvoice
    username: vetvoice
    password: vetvoice
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:1.7b
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
